name: Build portable Windows app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_version:
        description: Version for the app and GitHub release (for example 0.1.0)
        required: true
        type: string
        default: 0.1.0

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the solution
        run: dotnet build OpenNari.slnx --configuration Release

      - name: Check the release version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Use a version such as 0.1.0 or 0.1.0-rc.1."
          }

      - name: Publish one portable Windows executable
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.app_version || '0.1.0' }}
        run: |
          dotnet publish src/OpenNari/OpenNari.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$env:APP_VERSION `
            --output publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item publish/OpenNari.exe "publish/OpenNari-v$env:APP_VERSION-win-x64.exe"
          $fileName = "OpenNari-v$env:APP_VERSION-win-x64.exe"
          (Get-FileHash "publish/$fileName" -Algorithm SHA256).Hash.ToLower() + "  $fileName" |
            Set-Content "publish/$fileName.sha256"

      - name: Save the portable app build
        uses: actions/upload-artifact@v7
        with:
          name: OpenNari-windows-x64
          path: |
            publish/*.exe
            publish/*.sha256
          if-no-files-found: error


  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the portable app
        uses: actions/download-artifact@v7
        with:
          name: OpenNari-windows-x64
          path: publish

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          $fileName = "OpenNari-v$env:APP_VERSION-win-x64.exe"
          gh release create "v$env:APP_VERSION" `
            "publish/$fileName" `
            "publish/$fileName.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "OpenNari v$env:APP_VERSION" `
            --notes "Portable Windows x64 build of OpenNari v$env:APP_VERSION. Download the executable and run it; no installer is required."
