name: Build portable Windows app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: Choose a development build or a versioned release
        required: true
        type: choice
        options:
          - dev
          - release
        default: dev
      app_version:
        description: Required for release builds only (X.Y.Z, for example 1.2.3)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the solution
        run: dotnet build OpenNari.slnx --configuration Release

      - name: Check the release version
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          if ($env:APP_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release builds require a version in X.Y.Z form, such as 1.2.3."
          }

      - name: Publish one portable Windows executable
        shell: pwsh
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'dev' }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          $publishArguments = @(
            'publish', 'src/OpenNari/OpenNari.csproj',
            '--configuration', 'Release',
            '--runtime', 'win-x64',
            '--self-contained', 'true',
            '-p:PublishSingleFile=true',
            '-p:IncludeNativeLibrariesForSelfExtract=true',
            "-p:OpenNariBuildType=$env:BUILD_TYPE",
            '--output', 'publish'
          )
          if ($env:BUILD_TYPE -eq 'release') {
            $publishArguments += "-p:Version=$env:APP_VERSION"
          }
          dotnet @publishArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:BUILD_TYPE -eq 'release') {
            $fileName = "OpenNari-v$env:APP_VERSION-win-x64.exe"
          } else {
            $fileName = 'OpenNari-dev-win-x64.exe'
          }
          Move-Item publish/OpenNari.exe "publish/$fileName"

      - name: Save the portable app build
        uses: actions/upload-artifact@v7
        with:
          name: OpenNari-windows-x64
          path: publish/*.exe
          if-no-files-found: error


  release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the portable app
        uses: actions/download-artifact@v7
        with:
          name: OpenNari-windows-x64
          path: publish

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          $fileName = "OpenNari-v$env:APP_VERSION-win-x64.exe"
          gh release create "v$env:APP_VERSION" `
            "publish/$fileName" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "OpenNari v$env:APP_VERSION" `
            --notes "Portable Windows x64 build of OpenNari v$env:APP_VERSION. Download the executable and run it; no installer is required."
